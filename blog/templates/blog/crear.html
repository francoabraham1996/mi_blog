{% extends 'blog/base.html' %}


{% block titulo %}
Crear artículo
{% endblock %}


{% block contenido %}

    <h1>
        Crear artículo
    </h1>

    <hr>


    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}


        <button type="submit"
                class="btn btn-primary">

            Guardar artículo

        </button>


        <a href="{% url 'inicio' %}"
           class="btn btn-secondary">

            Volver

        </a>

    </form>

{% endblock %}
