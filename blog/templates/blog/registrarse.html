{% extends 'blog/base.html' %}

{% block titulo %}
Registrarse
{% endblock %}

{% block contenido %}

    <h1>
        Registrarse
    </h1>

    <hr>

    <form method="POST">

        {% csrf_token %}

        {{ formulario.as_p }}

        <button type="submit"
                class="btn btn-success">

            Registrarse

        </button>

        <a href="{% url 'inicio' %}"
           class="btn btn-secondary">

            Volver

        </a>

    </form>

{% endblock %}
